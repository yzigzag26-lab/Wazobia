<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>WAZOBIA — The African Language Ecosystem</title>
    <meta
      name="description"
      content="WAZOBIA is the African Language Ecosystem. Learn. Speak. Understand. Preserve. Yorùbá, Hausa and Igbo, with English as a bridge language."
    />

    <!-- Fonts are self-hosted and preloaded: they carry the Yorùbá tone marks and
         Igbo dotted vowels, which many subsetted web fonts silently omit. -->
    <link
      rel="preload"
      href="/fonts/wazobia-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/wazobia-serif.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!--
      The browser/PWA chrome colour tracks the *app's* theme, not the OS setting.
      With light as the default, a dark-OS device would otherwise paint a dark
      bar around a light app. The pre-paint script below corrects this to the
      dark value when a stored 'dark' preference (or 'system' on a dark device)
      applies; this static pair is the no-JS and first-paint fallback.
    -->
    <meta name="theme-color" content="#fbfaf6" />
    <meta name="theme-color" content="#0b100d" media="(prefers-color-scheme: dark)" />

    <!--
      Applies the stored theme before first paint.

      Without this the page renders light and then flips, which is a visible
      flash on every load for dark-mode users. It is inline and blocking by
      design (a few hundred bytes, no network), and it is intentionally
      duplicated logic: it must run before the React bundle evaluates.
      `src/stores/theme.tsx` owns the same key afterwards.

      The default is 'light', matching DEFAULT_THEME in `src/stores/theme.tsx`.
      An unset preference is NOT resolved from `prefers-color-scheme`: light is
      the product's own look, and dark is opted into (directly, or by choosing
      "System" in Settings → Appearance). The two defaults are kept in step by
      `src/config/themeDefault.test.ts`.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('wazobia.theme')
          var preference = stored ? JSON.parse(stored) : 'light'
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme

          // Keep the browser chrome the same colour as the page. The static
          // metas above follow the OS; this overrides them with the app's
          // actual theme so the two never disagree.
          var chroma = theme === 'dark' ? '#0b100d' : '#fbfaf6'
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute('content', chroma)
            metas[i].removeAttribute('media')
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      WAZOBIA needs JavaScript enabled to run. The platform is built as a React application.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
