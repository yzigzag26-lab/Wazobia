<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>WAZOBIA — The African Language Ecosystem</title>
    <meta
      name="description"
      content="WAZOBIA is the African Language Ecosystem. Learn. Speak. Understand. Preserve. Yorùbá, Hausa and Igbo, with English as a bridge language."
    />

    <!-- Fonts are self-hosted and preloaded: they carry the Yorùbá tone marks and
         Igbo dotted vowels, which many subsetted web fonts silently omit. -->
    <link
      rel="preload"
      href="/fonts/wazobia-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/wazobia-serif.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbf9f5" />
    <meta name="theme-color" content="#0b100d" media="(prefers-color-scheme: dark)" />

    <!--
      Applies the stored theme before first paint.

      Without this the page renders light and then flips, which is a visible
      flash on every load for dark-mode users. It is inline and blocking by
      design (a few hundred bytes, no network), and it is intentionally
      duplicated logic: it must run before the React bundle evaluates.
      `src/stores/theme.tsx` owns the same key afterwards.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('wazobia.theme')
          var preference = stored ? JSON.parse(stored) : 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      WAZOBIA needs JavaScript enabled to run. The platform is built as a React application.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
