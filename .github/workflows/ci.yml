name: CI

# Blueprint §13.1: lint, type-check, tests and build must pass before anything
# reaches production. Blueprint Appendix B asks for the same four checks.
#
# This workflow did not exist on the remote for the first phase, so the gate had
# never actually run. It now does, on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run on the same branch is wasted work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json requires >=20.19. Vite 8 needs 20.19+ or 22.12+.
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly the lockfile. It is the only install command
      # allowed in CI: `npm install` would silently repair a broken lockfile
      # instead of failing on it.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Guards the blueprint's hard security rule (§12): privileged keys must
      # never reach a client bundle. Fails the build rather than trusting review.
      - name: Assert no privileged keys reached the bundle
        run: |
          set -eu
          if grep -rIlE 'SUPABASE_SERVICE_ROLE_KEY|GROQ_API_KEY|GEMINI_API_KEY|TTS_PROVIDER_API_KEY|ASR_PROVIDER_API_KEY' dist/; then
            echo "::error::A server-only variable name appears in the client bundle."
            exit 1
          fi
          echo "No server-only variable names in dist/."
